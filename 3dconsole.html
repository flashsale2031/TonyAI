<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBJ Model with Morph Targets</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
    import { OBJLoader } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/loaders/OBJLoader.js';
    import { MTLLoader } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/loaders/MTLLoader.js';

    let scene, camera, renderer, model;
    let morphTargetInfluences, morphTargetDictionary;
    let currentInfluence = 0;
    let targetInfluence = 0;
    const transitionSpeed = 0.05;

    // Initialize scene
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 3;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Add ambient light
    const light = new THREE.AmbientLight(0x404040, 1);
    scene.add(light);

    // Load materials
    const mtlLoader = new MTLLoader();
    mtlLoader.load('BaseMeshscupt.mtl', (materials) => {
      materials.preload();

      // Load OBJ model
      const objLoader = new OBJLoader();
      objLoader.setMaterials(materials);
      objLoader.load('BaseMeshscupt.obj', (object) => {
        model = object;
        scene.add(model);

        // Traverse the model to find morph targets
        model.traverse((child) => {
          if (child.isMesh && child.morphTargetInfluences) {
            morphTargetInfluences = child.morphTargetInfluences;
            morphTargetDictionary = child.morphTargetDictionary;
          }
        });

        if (!morphTargetInfluences || !morphTargetDictionary) {
          console.warn('No morph targets found on model.');
        }

        animate();
      });
    });

    // Handle window resizing
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // Animate morph targets
    function animate() {
      requestAnimationFrame(animate);

      // Smoothly interpolate morph target influence
      if (morphTargetInfluences && morphTargetDictionary) {
        const targetName = 'Smile'; // Replace with your morph target name
        const targetIndex = morphTargetDictionary[targetName];
        if (targetIndex !== undefined) {
          currentInfluence += (targetInfluence - currentInfluence) * transitionSpeed;
          morphTargetInfluences[targetIndex] = currentInfluence;
        }
      }

      renderer.render(scene, camera);
    }

    // Update morph target influence based on user input
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowUp') {
        targetInfluence = Math.min(targetInfluence + 0.1, 1);
      } else if (event.key === 'ArrowDown') {
        targetInfluence = Math.max(targetInfluence - 0.1, 0);
      }
    });
  </script>
</body>
</html>
