<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1F4D">
<link rel="icon" href="branding/favicon.ico">
<title>TonyAI — AI Chat</title>
<style>
:root{--bg:#fff;--panel:rgba(255,255,255,.96);--text:#171717;--muted:#6b6b6b;--border:#e4e4e7;--hover:#f1f1f2;--accent:#111;--accent-contrast:#fff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}button,textarea,input{font:inherit}.app{height:100vh;display:flex;flex-direction:column}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:20}.brand{font-weight:800;letter-spacing:.28em;margin-left:.28em}.new-chat-btn,.icon-btn,.attach-btn,.send-btn{border:0;cursor:pointer;background:transparent}.new-chat-btn{min-height:40px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:#fff}.icon-btn{width:42px;height:42px}.topbar-left,.topbar-right{display:flex;align-items:center;gap:10px}.hamburger{display:flex;flex-direction:column;gap:4px;width:20px}.hamburger span{height:2px;background:currentColor}.dots{display:flex;gap:3px}.dots span{width:4px;height:4px;border-radius:50%;background:currentColor}.chat-area{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}.chat-empty{flex:1;display:grid;place-items:center;padding:48px 24px 150px;text-align:center}.welcome-mark{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 18px;border-radius:16px;background:#111;color:#fff;font-weight:800}.welcome h1{margin:0 0 10px}.welcome p{margin:0;color:var(--muted)}.messages{width:min(820px,calc(100% - 32px));margin:0 auto;padding:28px 0 160px;display:none}.messages.has-messages{display:block}.message{margin:0 0 22px;line-height:1.55}.message.user{display:flex;justify-content:flex-end}.message-bubble{max-width:min(760px,92%);padding:12px 15px;border-radius:16px;overflow-wrap:anywhere}.message.user .message-bubble{background:#f1f1f2}.message.assistant .message-bubble{padding-left:0}.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 20px;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.92) 25%,#fff 48%)}.composer{width:min(820px,100%);min-height:72px;margin:auto;display:grid;grid-template-columns:48px minmax(0,1fr) 52px;align-items:end;gap:6px;padding:10px 8px;border:1px solid #d7d7da;border-radius:20px;background:#fff;box-shadow:0 5px 24px rgba(0,0,0,.08)}.attach-btn,.send-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px}.send-btn{background:var(--accent);color:var(--accent-contrast)}.send-btn:disabled{opacity:.28}.composer textarea{width:100%;min-height:42px;max-height:160px;resize:none;border:0;outline:0;padding:9px 4px}.paperclip{width:18px;height:20px;border:2px solid currentColor;border-radius:10px;transform:rotate(42deg);border-top-color:transparent}.send-arrow{width:17px;height:17px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(-45deg)}.hidden-input{display:none}@media(max-width:720px){.topbar{padding:0 10px}.new-chat-label{display:none}.messages{width:calc(100% - 20px)}.composer-wrap{padding:12px 10px 14px}.composer{grid-template-columns:44px minmax(0,1fr) 48px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="topbar-left"><button class="icon-btn" id="menuButton" aria-label="Open menu"><span class="hamburger"><span></span><span></span><span></span></span></button></div><div class="topbar-right"><div class="brand">TONY</div><button class="new-chat-btn" id="newChatButton">＋ <span class="new-chat-label">New chat</span></button><button class="icon-btn" id="actionButton" aria-label="Chat actions"><span class="dots"><span></span><span></span><span></span></span></button></div></header>
<main class="chat-area" id="chatArea"><section class="chat-empty" id="emptyState"><div class="welcome"><div class="welcome-mark">T</div><h1>How can TONY help?</h1><p>Ask a question and TONY will inspect the web page behind the search result.</p></div></section><section class="messages" id="messages" aria-live="polite"></section><div class="composer-wrap"><form class="composer" id="composer"><button class="attach-btn" id="attachButton" type="button" aria-label="Add attachment"><span class="paperclip"></span></button><textarea id="messageInput" rows="1" placeholder="Search the web with TONY..." aria-label="Search the web with TONY"></textarea><button class="send-btn" id="sendButton" type="submit" disabled aria-label="Search the web"><span class="send-arrow"></span></button><input class="hidden-input" id="fileInput" type="file" multiple></form></div></main></div>
<script>
(()=>{
const $=id=>document.getElementById(id),input=$('messageInput'),send=$('sendButton'),messages=$('messages'),empty=$('emptyState'),composer=$('composer'),file=$('fileInput'),attach=$('attachButton'),newChat=$('newChatButton'),area=$('chatArea');let busy=false;const cache=new Map();
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();const esc=s=>clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const add=(html,role)=>{empty.style.display='none';messages.classList.add('has-messages');const a=document.createElement('article');a.className='message '+role;const b=document.createElement('div');b.className='message-bubble';b.innerHTML=html;a.appendChild(b);messages.appendChild(a);requestAnimationFrame(()=>area.scrollTop=area.scrollHeight);return b};
const status=t=>`<div style="color:#6b6b6b;font-size:.86rem">${esc(t)}</div>`;
function normalizeUrl(raw){let u=String(raw||'').trim();try{const x=new URL(u);const encoded=x.searchParams.get('uddg')||x.searchParams.get('url');if(encoded){const decoded=decodeURIComponent(encoded);if(/^https?:\/\//i.test(decoded))return decoded}if(/(^|\.)duckduckgo\.com$/i.test(x.hostname)&&x.pathname==='/l/'&&x.searchParams.get('uddg'))return decodeURIComponent(x.searchParams.get('uddg'));if(/external-content\.duckduckgo\.com/i.test(x.hostname)&&x.searchParams.get('uddg'))return decodeURIComponent(x.searchParams.get('uddg'))}catch{}return u}
function parseSearch(text){const out=[];for(const line of String(text||'').split(/\r?\n/)){const m=line.trim().match(/^\[([^\]]{2,240})\]\((https?:\/\/[^)]+)\)/);if(m){const url=normalizeUrl(m[2]);if(/^https?:\/\//i.test(url)&&!out.some(x=>x.url===url))out.push({title:clean(m[1]),url})}}return out.slice(0,8)}
async function ddg(query){const r=await fetch('https://r.jina.ai/http://html.duckduckgo.com/html/?q='+encodeURIComponent(query),{headers:{accept:'text/plain'},cache:'no-store'});if(!r.ok)throw Error('Live search failed ('+r.status+')');const results=parseSearch(await r.text());if(!results.length)throw Error('No web pages were found.');return results}
function factsFrom(text,query){const terms=clean(query).toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2);const blocks=String(text||'').replace(/\r/g,'').split(/(?<=[.!?])\s+|\n+/).map(clean).filter(x=>x.length>=35&&x.length<=700);const scored=blocks.map((s,i)=>({s,i,n:terms.reduce((n,t)=>n+(s.toLowerCase().includes(t)?1:0),0)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||a.i-b.i);return scored.slice(0,10).map(x=>x.s).filter((s,i,a)=>a.indexOf(s)===i)}
async function inspect(url,query){const target=normalizeUrl(url);if(!/^https?:\/\//i.test(target))throw Error('Invalid source URL.');const r=await fetch('https://r.jina.ai/'+target,{headers:{accept:'text/plain'},cache:'no-store'});if(!r.ok)throw Error('Page inspection failed ('+r.status+')');const raw=(await r.text()).replace(/\r/g,'').trim();if(raw.length<120)throw Error('The source page returned no readable content.');const lines=raw.split('\n').map(clean).filter(Boolean);const title=(lines.find(x=>/^Title:/i.test(x))||'').replace(/^Title:\s*/i,'');const description=(lines.find(x=>/^Description:/i.test(x))||'').replace(/^Description:\s*/i,'');const facts=factsFrom(raw,query);return{url:target,title:title||target,description,facts}}
async function server(query){const r=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,maxResults:10}),cache:'no-store'});if(!r.ok)throw Error('server unavailable');const d=await r.json();const s=d.selectedSource||d.result||(Array.isArray(d.results)?d.results[0]:null);if(!s?.url)throw Error('no selected source');return{source:{...s,url:normalizeUrl(s.url)},confidence:d.confidence}}
async function search(query){const key=clean(query).toLowerCase();if(cache.has(key))return cache.get(key);let selected=null,confidence=null;try{({source:selected,confidence}=await server(query))}catch{}if(!selected){const results=await ddg(query);selected=results[0]}let page;try{page=await inspect(selected.url,query)}catch{const results=await ddg(query);for(const candidate of results){try{page=await inspect(candidate.url,query);selected=candidate;break}catch{}}}if(!page)throw Error('No readable web page could be inspected.');const result={source:selected,page,confidence};cache.set(key,result);return result}
function render(result,ms){const p=result.page;const confidence=Number(result.confidence);const facts=p.facts.length?p.facts:[p.description||'The webpage was retrieved, but it did not expose query-relevant text.'];const domain=(()=>{try{return new URL(p.url).hostname.replace(/^www\./,'')}catch{return p.url}})();return `<div style="font-size:.82rem;color:#666;margin-bottom:7px">Web page inspected · ${Number.isFinite(confidence)?Math.round(confidence)+'% evidence confidence · ':''}${Math.round(ms)} ms</div><div style="font-weight:700;margin-bottom:8px">This is what I found.</div><div style="font-weight:700;margin-bottom:8px">${esc(p.title)}</div><div style="white-space:pre-wrap">${facts.map((f,i)=>`${i+1}. ${esc(f)}`).join('\n\n')}</div><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" style="display:block;margin-top:12px;font-size:.82rem">Open source webpage · ${esc(domain)}</a>`}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';send.disabled=!input.value.trim()||busy}
input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();composer.requestSubmit()}});newChat.onclick=()=>{messages.innerHTML='';messages.classList.remove('has-messages');empty.style.display='grid';input.value='';resize();input.focus()};attach.onclick=()=>file.click();file.onchange=()=>{file.value=''};
composer.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const query=clean(input.value);if(!query)return;busy=true;resize();add(esc(query),'user');input.value='';resize();const bubble=add(status('Searching the web and inspecting the selected webpage…'),'assistant');const started=performance.now();try{bubble.innerHTML=render(await search(query),performance.now()-started)}catch(err){bubble.innerHTML=`${status('No verified webpage answer was found.')}${err?.message?`<div style="color:#777;font-size:.8rem;margin-top:5px">${esc(err.message)}</div>`:''}`}finally{busy=false;resize();input.focus()}});resize();
})();
</script>
</body>
</html>
