<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1F4D">
<title>TonyAI — AI Chat</title>
<style>
:root{--border:#e4e4e7;--muted:#6b6b6b;--navy:#0b1f4d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#171717}
button{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.topbar{height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:#fff;position:relative;z-index:20}
.topbar-left{justify-self:start}
.topbar-right{justify-self:end;display:flex;align-items:center;gap:8px}
.brand{font-weight:800;letter-spacing:.28em}
.icon-btn,.new-chat-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
.icon-btn{font-size:20px;line-height:1;min-width:42px}
.new-chat-btn{font-size:14px}
.menu-panel{position:absolute;top:58px;left:12px;width:min(280px,calc(100vw - 24px));background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 35px #0002;padding:8px;display:none;z-index:30}
.menu-panel.open{display:block}
.menu-title{font-size:12px;font-weight:700;color:var(--muted);padding:9px 12px 6px;text-transform:uppercase;letter-spacing:.08em}
.menu-item{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:9px;padding:11px 12px;cursor:pointer}
.menu-item:hover,.menu-item:focus-visible{background:#f3f4f6}
.chat-area{flex:1;overflow:auto}
.home{text-align:center;padding:50px 18px;color:var(--muted)}
.messages{width:min(820px,calc(100% - 28px));margin:auto;padding:28px 0 150px}
.message{margin:0 0 22px;line-height:1.55}
.user{display:flex;justify-content:flex-end}
.bubble{max-width:96%;overflow-wrap:anywhere}
.user .bubble{background:#f1f1f2;border-radius:16px;padding:12px 15px}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#fff 35%);z-index:10}
.composer{width:min(820px,100%);margin:auto;display:grid;grid-template-columns:1fr 50px;gap:8px;padding:9px;border:1px solid #d7d7da;border-radius:18px;background:#fff;box-shadow:0 5px 24px #0001}
.composer textarea{min-height:42px;max-height:160px;resize:none;border:0;outline:0;padding:9px;font:inherit}
.send{border:0;border-radius:12px;background:#111;color:#fff}
.status{color:var(--muted);font-size:.86rem}
.meta{color:#777;font-size:.78rem;margin:5px 0 12px}
.artifact{border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:14px}
.artifact-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.artifact button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
.artifact iframe{width:100%;height:310px;border:1px solid var(--border);border-radius:10px}
.artifact pre{white-space:pre-wrap;overflow:auto;max-height:280px;background:#f7f7f8;border-radius:10px;padding:12px;font-size:12px}
@media(max-width:600px){.topbar{padding:0 10px}.brand{font-size:13px}.new-chat-btn{padding:8px 9px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mainMenu">☰</button>
    <nav class="menu-panel" id="mainMenu" aria-label="TonyAI menu">
      <div class="menu-title">TonyAI</div>
      <button class="menu-item" type="button" data-menu-action="new-chat">＋ New Chat</button>
      <button class="menu-item" type="button" data-menu-action="image-chat">▧ Image Chat</button>
      <button class="menu-item" type="button" data-menu-action="library">▤ Library</button>
      <button class="menu-item" type="button" data-menu-action="schedule">◷ Schedule Chats</button>
      <button class="menu-item" type="button" data-menu-action="plugins">⚙ Plugins / Adjust</button>
      <button class="menu-item" type="button" data-menu-action="code">⌘ Code Injected Chat</button>
      <button class="menu-item" type="button" data-menu-action="animate">✦ Animate</button>
    </nav>
  </div>
  <div class="brand">TONY</div>
  <div class="topbar-right"><button class="new-chat-btn" id="newChat" type="button">＋ New chat</button></div>
</header>
<main class="chat-area" id="chatArea">
  <section class="home" id="home"><h1>How can TONY help?</h1><p>Ask a question, request code, or ask TONY to build an HTML document.</p></section>
  <section class="messages" id="messages"></section>
</main>
<div class="composer-wrap"><form class="composer" id="composer"><textarea id="input" rows="1" placeholder="Search the web with TONY…"></textarea><button class="send" type="submit">↑</button></form></div>
</div>
<script src="./static-answer.js" defer></script>
<script src="./app.js" defer></script>
<script src="./agent-client.js" defer></script>
<script>
(()=>{
  const toggle=document.getElementById('menuToggle');
  const menu=document.getElementById('mainMenu');
  const newChat=document.getElementById('newChat');
  const close=()=>{menu.classList.remove('open');toggle.setAttribute('aria-expanded','false')};
  toggle.addEventListener('click',()=>{const open=!menu.classList.contains('open');menu.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open))});
  document.addEventListener('click',event=>{if(!menu.contains(event.target)&&event.target!==toggle)close()});
  menu.addEventListener('click',event=>{
    const button=event.target.closest('[data-menu-action]');
    if(!button)return;
    if(button.dataset.menuAction==='new-chat')newChat.click();
    else if(button.dataset.menuAction==='image-chat')document.getElementById('input').value='Create an image';
    else document.getElementById('input').value=button.textContent.trim()+' request';
    close();
    document.getElementById('input').focus();
  });
})();
</script>
</body>
</html>
