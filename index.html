<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1F4D">
<link rel="icon" href="branding/favicon.ico">
<title>TonyAI — AI Chat</title>
<style>
:root{--bg:#fff;--panel:rgba(255,255,255,.96);--text:#171717;--muted:#6b6b6b;--border:#e4e4e7;--hover:#f1f1f2;--accent:#111;--accent-contrast:#fff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}button,textarea,input{font:inherit}button{color:inherit}.app{min-height:100%;height:100vh;display:flex;flex-direction:column}.topbar{height:64px;min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(16px);position:relative;z-index:20}.topbar-left,.topbar-right,.brand-wrap{display:flex;align-items:center}.topbar-left{gap:12px}.topbar-right{justify-content:flex-end}.brand-wrap{justify-content:center;gap:12px}.icon-btn,.new-chat-btn,.menu-item,.send-btn,.attach-btn{border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:11px}.icon-btn:hover,.icon-btn:focus-visible,.attach-btn:hover,.attach-btn:focus-visible{background:var(--hover);outline:none}.hamburger{width:20px;height:14px;display:flex;flex-direction:column;justify-content:space-between}.hamburger span{height:2px;width:100%;border-radius:2px;background:currentColor}.brand{font-size:1.05rem;font-weight:800;letter-spacing:.28em;margin-left:.28em;white-space:nowrap}.new-chat-btn{min-height:40px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:.9rem;font-weight:650}.dots{display:flex;gap:3px}.dots span{width:4px;height:4px;border-radius:50%;background:currentColor}.chat-area{flex:1;min-height:0;position:relative;overflow:auto;display:flex;flex-direction:column}.chat-empty{flex:1;display:grid;place-items:center;padding:48px 24px 150px;text-align:center}.welcome{max-width:650px;margin:auto}.welcome-mark{width:56px;height:56px;display:grid;place-items:center;margin:0 auto 18px;border-radius:16px;background:#111;color:#fff;font-weight:800;letter-spacing:.16em}.welcome h1{margin:0 0 10px;font-size:clamp(1.6rem,3vw,2.1rem)}.welcome p{margin:0;color:var(--muted);line-height:1.55}.messages{width:min(820px,calc(100% - 32px));margin:0 auto;padding:28px 0 160px;display:none}.messages.has-messages{display:block}.message{display:flex;gap:12px;margin:0 0 22px;line-height:1.55}.message.user{justify-content:flex-end}.message-bubble{max-width:min(760px,92%);padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user .message-bubble{background:#f1f1f2}.message.assistant .message-bubble{padding-left:0}.composer-wrap{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:16px 18px 20px;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.9) 22%,#fff 46%)}.composer{width:min(820px,100%);min-height:72px;margin:0 auto;display:grid;grid-template-columns:48px minmax(0,1fr) 52px;align-items:end;gap:6px;padding:10px 8px;border:1px solid #d7d7da;border-radius:20px;background:#fff;box-shadow:0 5px 24px rgba(0,0,0,.08)}.attach-btn,.send-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:12px}.send-btn{background:var(--accent);color:var(--accent-contrast)}.send-btn:disabled{opacity:.28;cursor:default}.composer textarea{width:100%;min-height:42px;max-height:160px;resize:none;border:0;outline:none;background:transparent;padding:9px 4px;color:var(--text);line-height:1.45}.composer textarea::placeholder{color:#8a8a8f}.paperclip{width:18px;height:20px;display:block;border:2px solid currentColor;border-radius:10px;transform:rotate(42deg);border-top-color:transparent;position:relative}.paperclip:after{content:"";position:absolute;width:8px;height:12px;border:2px solid currentColor;border-radius:8px;left:3px;top:2px;border-top-color:transparent}.send-arrow{width:17px;height:17px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(-45deg) translate(-1px,1px)}.hidden-input{display:none}.dropdown{position:absolute;top:56px;width:250px;padding:7px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.12);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.15s}.dropdown.open{opacity:1;visibility:visible;transform:translateY(0)}.menu-dropdown{left:14px}.action-dropdown{right:14px;width:220px}.menu-item{width:100%;min-height:42px;display:flex;align-items:center;gap:11px;padding:0 11px;border-radius:9px;text-align:left;font-size:.92rem}.menu-item:hover{background:var(--hover)}.menu-item-icon{width:20px;text-align:center;color:#555}.menu-divider{height:1px;margin:6px 4px;background:var(--border)}.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,12px);padding:9px 13px;border-radius:10px;background:#18181b;color:#fff;font-size:.84rem;opacity:0;pointer-events:none;transition:.16s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.topbar{grid-template-columns:auto 1fr auto;gap:8px;padding:0 10px}.brand-wrap{justify-content:flex-start}.new-chat-btn{padding:0 12px}.new-chat-label{display:none}.messages{width:min(100% - 20px,820px)}.composer-wrap{padding:12px 10px 14px}.composer{grid-template-columns:44px minmax(0,1fr) 48px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="topbar-left"><button class="icon-btn" id="menuButton" aria-label="Open main menu"><span class="hamburger"><span></span><span></span><span></span></span></button><nav class="dropdown menu-dropdown" id="mainMenu"><button class="menu-item" data-action="New Chat"><span class="menu-item-icon">＋</span><span>New Chat</span></button><button class="menu-item" data-action="Image Chat"><span class="menu-item-icon">▧</span><span>Image Chat</span></button><button class="menu-item" data-action="Library"><span class="menu-item-icon">▱</span><span>Library</span></button><button class="menu-item" data-action="Schedule Chats"><span class="menu-item-icon">◷</span><span>Schedule Chats</span></button><button class="menu-item" data-action="Plugins"><span class="menu-item-icon">⌘</span><span>Plugins</span></button><button class="menu-item" data-action="Code Injected Chat"><span class="menu-item-icon">&lt;/&gt;</span><span>Code Injected Chat</span></button></nav></div><div class="brand-wrap"><div class="brand">TONY</div><button class="new-chat-btn" id="newChatButton">＋ <span class="new-chat-label">New chat</span></button></div><div class="topbar-right"><button class="icon-btn" id="actionButton" aria-label="Chat actions"><span class="dots"><span></span><span></span><span></span></span></button><div class="dropdown action-dropdown" id="actionMenu"><button class="menu-item" data-action="Share"><span class="menu-item-icon">↗</span><span>Share</span></button><button class="menu-item" data-action="View Chat Media"><span class="menu-item-icon">▧</span><span>View Chat Media</span></button><button class="menu-item" data-action="Pin Chat"><span class="menu-item-icon">⌑</span><span>Pin Chat</span></button><button class="menu-item" data-action="Archive"><span class="menu-item-icon">▣</span><span>Archive</span></button></div></div></header>
<main class="chat-area" id="chatArea"><section class="chat-empty" id="emptyState"><div class="welcome"><div class="welcome-mark">T</div><h1>How can TONY help?</h1><p>Ask a question and TONY will search the web for a sourced answer.</p></div></section><section class="messages" id="messages" aria-live="polite"></section><div class="composer-wrap"><form class="composer" id="composer"><button class="attach-btn" id="attachButton" type="button" aria-label="Add attachment"><span class="paperclip"></span></button><textarea id="messageInput" rows="1" placeholder="Search the web with TONY..." aria-label="Search the web with TONY"></textarea><button class="send-btn" id="sendButton" type="submit" disabled aria-label="Search the web"><span class="send-arrow"></span></button><input class="hidden-input" id="fileInput" type="file" multiple></form></div></main></div><div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),menuButton=$('menuButton'),actionButton=$('actionButton'),mainMenu=$('mainMenu'),actionMenu=$('actionMenu'),newChatButton=$('newChatButton'),composer=$('composer'),input=$('messageInput'),sendButton=$('sendButton'),attachButton=$('attachButton'),fileInput=$('fileInput'),messages=$('messages'),emptyState=$('emptyState'),toast=$('toast');let toastTimer=0,request=0;const cache=new Map();
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();const esc=s=>clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const scroll=()=>requestAnimationFrame(()=>{const a=$('chatArea');if(a)a.scrollTop=a.scrollHeight});const status=t=>`<div style="color:#6b6b6b;font-size:.86rem">${esc(t)}</div>`;const add=(html,role)=>{emptyState.style.display='none';messages.classList.add('has-messages');const item=document.createElement('article');item.className='message '+role;const bubble=document.createElement('div');bubble.className='message-bubble';bubble.innerHTML=html;item.appendChild(bubble);messages.appendChild(item);scroll();return bubble};
const domain=url=>{try{return new URL(url).hostname.replace(/^www\./,'')}catch{return''}};
function parseSearch(text){const lines=String(text||'').split(/\r?\n/).map(clean).filter(Boolean),out=[];let current=null;for(const line of lines){const m=line.match(/^\[([^\]]{2,220})\]\((https?:\/\/[^)]+)\)/);if(m){current={title:m[1],url:m[2]};out.push(current)}}return out.filter((v,i,a)=>v.url&&!a.slice(0,i).some(x=>x.url===v.url)).slice(0,8)}
async function ddg(query){const r=await fetch('https://r.jina.ai/http://html.duckduckgo.com/html/?q='+encodeURIComponent(query),{headers:{accept:'text/plain'},cache:'no-store'});if(!r.ok)throw Error('Live search failed ('+r.status+')');const results=parseSearch(await r.text());if(!results.length)throw Error('No search results were returned.');return results}
function relevantSentences(text,query){const terms=clean(query).toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2);const sentences=String(text||'').replace(/\r/g,'').split(/(?<=[.!?])\s+/).map(clean).filter(s=>s.length>=40&&s.length<=600);const scored=sentences.map((s,i)=>({s,i,score:terms.reduce((n,t)=>n+(s.toLowerCase().includes(t)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.i-b.i);const chosen=[];for(const x of scored){if(chosen.length>=10)break;if(!chosen.some(y=>y.s===x.s))chosen.push(x)}return chosen.map(x=>x.s)}
async function inspect(url,query){const r=await fetch('https://r.jina.ai/'+url,{headers:{accept:'text/plain'},cache:'no-store'});if(!r.ok)throw Error('Page inspection failed ('+r.status+')');const text=(await r.text()).replace(/\r/g,'').trim();if(text.length<80)throw Error('Page did not return readable content.');const lines=text.split('\n').map(clean).filter(Boolean);const title=lines.find(x=>/^Title:/i.test(x))?.replace(/^Title:\s*/i,'')||'';const description=lines.find(x=>/^Description:/i.test(x))?.replace(/^Description:\s*/i,'')||'';const facts=relevantSentences(text,query);return{url,title:title||url,description,facts,textLength:text.length}}
async function serverSearch(query){const r=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,maxResults:10}),cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Server search unavailable');const source=data.selectedSource||data.result||(Array.isArray(data.results)?data.results[0]:null);if(!source?.url)throw Error('Server returned no selected source.');return{source,data}}
async function webSearch(query){const key=clean(query).toLowerCase();if(cache.has(key))return cache.get(key);let source=null,data=null;try{({source,data}=await serverSearch(query))}catch{}if(!source){const results=await ddg(query);source=results[0];data={confidence:null}}let page;try{page=await inspect(source.url,query)}catch{const results=await ddg(query);for(const candidate of results){try{page=await inspect(candidate.url,query);source=candidate;break}catch{}}}if(!page)throw Error('The selected webpage could not be inspected.');const result={source,page,confidence:data?.confidence};cache.set(key,result);return result}
function render(result,elapsed){const s=result.source,p=result.page;const confidence=Number(result.confidence);const meta=Number.isFinite(confidence)?`Web page inspected · ${Math.round(confidence)}% evidence confidence`:'Web page inspected · live source';const facts=p.facts.length?p.facts:[p.description||'The page was retrieved successfully, but no query-relevant factual sentences were extracted.'];return `<div style="font-size:.82rem;color:#666;margin-bottom:7px">${esc(meta)} · ${Math.max(0,Math.round(elapsed))} ms</div><div style="font-weight:700;margin-bottom:8px">This is what I found.</div><div style="font-weight:700;margin-bottom:4px">${esc(p.title||s.title||s.url)}</div>${p.description?`<div style="color:#666;margin-bottom:10px">${esc(p.description)}</div>`:''}<div style="white-space:pre-wrap">${facts.map((f,i)=>`${i+1}. ${esc(f)}`).join('\n\n')}</div><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" style="display:block;margin-top:12px;font-size:.82rem">Open the inspected webpage · ${esc(domain(p.url))}</a>`}
function noAnswer(e){return `${status('No verified webpage answer was found.')}${e?`<div style="color:#777;font-size:.8rem;margin-top:5px">${esc(e.message||e)}</div>`:''}`}
function closeMenus(){mainMenu.classList.remove('open');actionMenu.classList.remove('open')}
menuButton.onclick=e=>{e.stopPropagation();mainMenu.classList.toggle('open');actionMenu.classList.remove('open')};actionButton.onclick=e=>{e.stopPropagation();actionMenu.classList.toggle('open');mainMenu.classList.remove('open')};document.onclick=closeMenus;
document.querySelectorAll('[data-action]').forEach(x=>x.onclick=e=>{e.stopPropagation();const a=x.dataset.action;closeMenus();if(a==='New Chat')newChat();else{toast.textContent=a+' selected';toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}});
function newChat(){messages.innerHTML='';messages.classList.remove('has-messages');emptyState.style.display='grid';input.value='';autoSize();input.focus()}
function autoSize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';sendButton.disabled=!input.value.trim()}
input.oninput=autoSize;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();composer.requestSubmit()}};newChatButton.onclick=newChat;attachButton.onclick=()=>fileInput.click();fileInput.onchange=()=>{if(fileInput.files.length){toast.textContent='Attachment selected: '+Array.from(fileInput.files).map(f=>f.name).join(', ');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900)}fileInput.value=''};
composer.onsubmit=async e=>{e.preventDefault();e.stopImmediatePropagation();const query=clean(input.value);if(!query||sendButton.dataset.busy==='1')return;sendButton.dataset.busy='1';const id=++request;add(esc(query),'user');input.value='';autoSize();const bubble=add(status('Searching the web and inspecting the selected webpage…'),'assistant');const started=performance.now();try{const result=await webSearch(query);if(id!==request)return;bubble.innerHTML=render(result,performance.now()-started)}catch(error){if(id===request)bubble.innerHTML=noAnswer(error)}finally{sendButton.dataset.busy='0';sendButton.disabled=false;input.focus();scroll()}};autoSize();
})();
</script>
</body>
</html>
