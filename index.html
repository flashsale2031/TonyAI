<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B1F4D"><title>TonyAI — AI Chat</title><style>:root{--border:#e4e4e7;--muted:#6b6b6b}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#171717}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border)}.brand{font-weight:800;letter-spacing:.28em}.new-chat-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 14px}.chat-area{flex:1;overflow:auto}.home{text-align:center;padding:50px 18px;color:var(--muted)}.messages{width:min(820px,calc(100% - 28px));margin:auto;padding:28px 0 150px}.message{margin:0 0 22px;line-height:1.55}.user{display:flex;justify-content:flex-end}.bubble{max-width:96%;overflow-wrap:anywhere}.user .bubble{background:#f1f1f2;border-radius:16px;padding:12px 15px}.composer-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#fff 35%)}.composer{width:min(820px,100%);margin:auto;display:grid;grid-template-columns:1fr 50px;gap:8px;padding:9px;border:1px solid #d7d7da;border-radius:18px;background:#fff;box-shadow:0 5px 24px #0001}.composer textarea{min-height:42px;max-height:160px;resize:none;border:0;outline:0;padding:9px;font:inherit}.send{border:0;border-radius:12px;background:#111;color:#fff}.status{color:var(--muted);font-size:.86rem}.meta{color:#777;font-size:.78rem;margin:5px 0 12px}.artifact{border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:14px}.artifact-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.artifact button{border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}.artifact iframe{width:100%;height:310px;border:1px solid var(--border);border-radius:10px}.artifact pre{white-space:pre-wrap;overflow:auto;max-height:280px;background:#f7f7f8;border-radius:10px;padding:12px;font-size:12px}@media(max-width:600px){.topbar{padding:0 10px}}</style></head><body><div class="app"><header class="topbar"><div></div><div class="brand">TONY</div><button class="new-chat-btn" id="newChat">＋ New chat</button></header><main class="chat-area" id="chatArea"><section class="home" id="home"><h1>How can TONY help?</h1><p>Ask a question, request code, or ask TONY to build an HTML document.</p></section><section class="messages" id="messages"></section></main><div class="composer-wrap"><form class="composer" id="composer"><textarea id="input" rows="1" placeholder="Search the web with TONY…"></textarea><button class="send" type="submit">↑</button></form></div></div><script src="./app.js" defer></script></body></html>
