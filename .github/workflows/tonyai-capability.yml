name: TonyAI capability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Run npm test with diagnostics
        id: npm_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > npm-test.log 2>&1
          status=$?
          cat npm-test.log
          printf '%s' "$status" > npm-test.status
          exit 0
      - name: Upload npm test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-diagnostics
          path: |
            npm-test.log
            npm-test.status
          if-no-files-found: warn
      - run: npm run lint
      - name: Run 100-question Duck.ai + TonyAI chatbox test
        id: duckai_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/chatbox-100-ci-v3.mjs > duckai-test.log 2>&1
          status=$?
          cat duckai-test.log
          printf '%s' "$status" > duckai-test.status
          exit 0
      - name: Upload Duck.ai test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckai-test-diagnostics
          path: |
            duckai-test.log
            duckai-test.status
          if-no-files-found: warn
      - name: Fail CI if tests failed
        if: always()
        shell: bash
        run: |
          test "$(cat npm-test.status)" = "0"
          test "$(cat duckai-test.status)" = "0"
