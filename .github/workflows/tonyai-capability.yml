name: TonyAI capability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - run: npm test
      - run: npm run lint
      - name: Run exactly 100 Duck.ai + TonyAI chatbox tests in 10 parts
        id: duckai
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/chatbox-100-ci-v17.mjs > duckai-test.log 2>&1
          status=$?
          cat duckai-test.log
          printf '%s' "$status" > duckai-test.status
          exit 0
      - name: Upload Duck.ai diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckai-test-diagnostics
          path: |
            duckai-test.log
            duckai-test.status
          if-no-files-found: error
      - name: Fail if Duck.ai tests failed
        shell: bash
        run: |
          test -s duckai-test.status
          test "$(cat duckai-test.status)" = "0"
