name: TonyAI capability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - run: npm test
      - run: npm run lint
      - name: Run 100-question Duck.ai + TonyAI chatbox test
        run: node scripts/chatbox-100-ci.mjs
