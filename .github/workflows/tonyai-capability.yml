name: TonyAI capability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Run npm test with diagnostics
        id: npm-test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee npm-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload npm test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-diagnostics
          path: npm-test.log
          if-no-files-found: warn
      - run: npm run lint
      - name: Run 100-question Duck.ai + TonyAI chatbox test
        id: duckai-test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/chatbox-100-ci-v3.mjs 2>&1 | tee duckai-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Duck.ai test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckai-test-diagnostics
          path: duckai-test.log
          if-no-files-found: warn
      - name: Fail CI if tests failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.npm-test.outputs.status }}" = "0"
          test "${{ steps.duckai-test.outputs.status }}" = "0"
